name: PALIMPSESTE — Android case preview

on:
  push:
    branches: [palimpseste]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test investigation logic and offline package
        run: node --test tests/*.cjs
      - name: Embed original game
        run: |
          mkdir -p android/app/src/main/assets/game
          cp -R game/. android/app/src/main/assets/game/
      - name: Compile native Android package
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Verify signed APK and integrity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: PALIMPSESTE-0.3-Android-APK-Immersif
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
