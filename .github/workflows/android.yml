name: ASTRA TIDE — Android preview

on:
  push:
    branches: [astra-tide]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run engine and asset tests
        run: node --test tests/engine.cjs tests/assets.cjs
      - name: Bundle entirely offline game
        run: |
          mkdir -p android/app/src/main/assets/game
          cp -R game/. android/app/src/main/assets/game/
      - name: Build installable debug APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Verify APK package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ASTRA-TIDE-v0.1-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
