plugins {
    id 'com.android.application'
}

android {
    namespace 'com.layadam.afterglow'
    compileSdk 36

    defaultConfig {
        applicationId 'com.layadam.afterglow'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
        resourceConfigurations += ['fr']
        manifestPlaceholders = [appLabel: 'AFTERGLOW']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // A different app ID: preserve the already installed v1.0.0 and its save.
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: 'AFTERGLOW PREVIEW']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: 'AFTERGLOW']
            // AAB Play Store à signer avec une clé conservée exclusivement
            // dans les secrets CI, jamais dans ce dépôt public.
        }
    }

    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
