plugins {
    id 'com.android.application'
}

android {
    namespace 'com.layadam.palimpseste'
    compileSdk 36

    defaultConfig {
        applicationId 'com.layadam.palimpseste'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        resourceConfigurations += ['fr']
        manifestPlaceholders = [appLabel: 'PALIMPSESTE']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // CI generates an ephemeral debug key: install alongside v0.1 instead of risking
            // an incompatible update or an unintentional loss of the original local save.
            applicationIdSuffix '.preview02'
            versionNameSuffix '-preview'
            manifestPlaceholders = [appLabel: 'PALIMPSESTE AIDE']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: 'PALIMPSESTE']
            // AAB Play Store à signer avec une clé conservée exclusivement
            // dans les secrets CI, jamais dans ce dépôt public.
        }
    }

    packaging {
        resources.excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
